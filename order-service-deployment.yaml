apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-node-app-deployment
  labels:
    app: node-app
spec:
  replicas: 2 # Sets the number of pod instances to run
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        # IMPORTANT: Replace this with your actual built image (e.g., myuser/node-app:v1)
        image: avinash8476/order-service:11
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 30082 
        resources:
          requests:
            memory: "64Mi"   # Enough for the container to start
            cpu: "10m"       # 1/100th of a core (sufficient for idle/low traffic)
          limits:
            memory: "128Mi"  # Hard cap to prevent memory leaks affecting node
            cpu: "50m"
        env:
        - name: NODE_ENV
          value: "production"

---

apiVersion: v1
kind: Service
metadata:
  name: node-app-service-302
spec:
  selector:
    app: node-app
  type: LoadBalancer # Exposes the service externally (use ClusterIP for internal only)
  ports:
    - protocol: TCP
      port: 30082       # Port accessible on the Service
      targetPort: 30082 # Port the container is listening on (matches EXPOSE)
      nodePort: 30092
